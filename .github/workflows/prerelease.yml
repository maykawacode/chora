name: Draft prerelease

on:
  push:
    tags:
      - 'v*.*.*-beta.*'

permissions:
  contents: write

concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Build ad-hoc-signed Apple-silicon DMG
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Require an exact version tag
        shell: bash
        run: |
          expected_tag="v$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $expected_tag"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run typecheck
        run: npm run typecheck

      - name: Build ad-hoc-signed DMG
        run: npm run dist

      - name: Generate SHA-256 checksum
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          artifact="Chora-${version}-arm64.dmg"
          test -f "dist/${artifact}"
          cd dist
          shasum -a 256 "$artifact" > SHA256SUMS.txt

      - name: Create or refresh draft prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          artifact="dist/Chora-${version}-arm64.dmg"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              "$artifact#Chora ${version} for Apple silicon" \
              "dist/SHA256SUMS.txt#SHA-256 checksums" \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" \
              "$artifact#Chora ${version} for Apple silicon" \
              "dist/SHA256SUMS.txt#SHA-256 checksums" \
              --verify-tag \
              --draft \
              --prerelease \
              --title "Chora ${version}" \
              --generate-notes \
              --repo "$GITHUB_REPOSITORY"
          fi
