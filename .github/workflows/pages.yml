name: Publish site

# Publishes the landing page and the browser version to GitHub Pages:
# site/ from main at the root (maykawacode.github.io/chora/) and the app,
# built from a release tag, at app/ (maykawacode.github.io/chora/app/).
#
# A new release tag republishes with that tag's app; a push to main that
# touches site/ republishes the page with the latest tag's app. To roll back,
# run it by hand with the earlier tag. Automatic runs wait until the
# repository variable PAGES_LIVE is "true", set when Pages is switched on, so
# nothing fails before then; a run by hand always proceeds.

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - 'site/**'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build the app from (blank for the latest)
        required: false
        type: string

# Deny by default. Each job opts in to exactly the scope it needs.
permissions: {}

# One publish at a time, and a running publish is never cut short.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site and app
    if: github.event_name == 'workflow_dispatch' || vars.PAGES_LIVE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Read-only: this job runs the build tooling.
    permissions:
      contents: read

    steps:
      - name: Check out main for the site
        uses: actions/checkout@v6
        with:
          ref: main
          # All tags, to find the latest release.
          fetch-depth: 0
          persist-credentials: false

      - name: Choose the release tag
        id: tag
        shell: bash
        env:
          REQUESTED: ${{ inputs.tag }}
        run: |
          if [[ -n "$REQUESTED" ]]; then
            tag="$REQUESTED"
          else
            # Version order, with -beta.N before the release it leads to.
            tag="$(git -c versionsort.suffix=-beta tag --list 'v*' --sort=-v:refname | head -n 1)"
          fi
          if ! git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; then
            echo "::error::No release tag ${tag:-found}"
            exit 1
          fi
          echo "Building the app from ${tag}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Check out the release for the app
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.tag.outputs.tag }}
          path: release
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: release/package-lock.json

      - name: Check the site
        # CSP, relative and existing references, links to app/. Needs Node 24
        # but no dependencies.
        run: npm run site:check

      - name: Install dependencies
        # As in CI and the release pipeline: no dependency lifecycle scripts.
        working-directory: release
        run: npm ci --ignore-scripts

      - name: Build the browser version
        working-directory: release
        run: npm run web:build

      - name: Check the browser build
        working-directory: release
        run: npm run web:check

      - name: Assemble the site
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          mkdir _site
          cp -R site/. _site/
          rm -f _site/README.md
          cp -R release/dist-web _site/app
          test -f _site/index.html
          test -f _site/app/index.html
          # Show the release being published under the wordmark.
          sed -i "s|<p class=\"version\">[^<]*</p>|<p class=\"version\">${TAG}</p>|" _site/index.html
          grep -qF "<p class=\"version\">${TAG}</p>" _site/index.html

      - name: Hand the site to the publishing job
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only job allowed to publish. It runs no project code.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
