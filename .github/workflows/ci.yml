name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, typecheck, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        # Matches the release pipeline: no dependency lifecycle scripts, so CI
        # exercises the same install path that produces a shipped build.
        run: npm ci --ignore-scripts

      - name: Run tests
        run: npm test

      - name: Run typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unused code
        run: npm run knip

      - name: Build production bundles
        run: npm run build

      - name: Build browser version
        run: npm run web:build

      - name: Check browser output
        # CSP, relative asset paths, and no Node/Electron code in the bundle.
        run: npm run web:check

      - name: Check landing page
        # CSP, relative and existing references, and links to app/ in site/.
        run: npm run site:check
